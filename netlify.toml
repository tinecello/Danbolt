# Bygger bare den statiske forsiden. Det gamle React-oppsettet (prerender)
# skal ikke kjøres, da det lager kopier av siden på gamle adresser.
[build]
  command = "npm install && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Staging skal kunne testes offentlig, men ikke dukke opp i søkemotorer.
[context.staging]
  command = "npm install && npx vite build && cp ./custom-headers/_stagingHeaders ./dist/_headers"

# Gamle adresser fra forrige versjon av nettstedet sendes permanent (301)
# til riktig del av den nye forsiden. Adresser som ikke finnes gir ekte 404.
[[redirects]]
  from = "/favicon.ico"
    to = "/favicon.svg"
      status = 200

      
[[redirects]]
  from = "/kirkelydpakken"
  to = "/#losninger"
  status = 301

[[redirects]]
  from = "/kartlegging"
  to = "/#hensyn"
  status = 301

[[redirects]]
  from = "/lyd-i-kirken"
  to = "/#om"
  status = 301

[[redirects]]
  from = "/kurs/*"
  to = "/#kontakt"
  status = 301

[[redirects]]
  from = "/blogg"
  to = "/"
  status = 301

[[redirects]]
  from = "/blogg/*"
  to = "/"
  status = 301

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
