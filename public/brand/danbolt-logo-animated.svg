<svg xmlns="http://www.w3.org/2000/svg" viewBox="316 300 680 190" role="img" aria-labelledby="logo-title"><title id="logo-title">Danbolt</title><style>
.wave,.letter,.source{transform-box:view-box}
.wave{transform-origin:340px 392px}
.wave-inner{animation:inner-expand .8s cubic-bezier(.4,0,.2,1) .20s both,appear .32s ease .20s both}
.wave-outer{animation:outer-expand .8s cubic-bezier(.4,0,.2,1) .58s both,appear .32s ease .58s both}
.source{animation:appear .25s ease both}
.letter{animation:appear .55s ease both}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes inner-expand{from{transform:scale(.44)}to{transform:scale(1)}}
@keyframes outer-expand{from{transform:scale(.75)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.wave,.letter,.source{animation:none!important;opacity:1;transform:none}}
</style><g fill="none" stroke="#25211f" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"><path class="wave wave-inner" xmlns="http://www.w3.org/2000/svg" d="M326 342 H360 A50 50 0 0 1 360 442 H326" /><path class="wave wave-outer" xmlns="http://www.w3.org/2000/svg" d="M326 314 H360 A78 78 0 0 1 360 470 H326" /><g class="letter" style="animation-delay:0.480s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(0.0 0)"><path d="M 477.0 408.0 a 36.0 36.0 0 1 0 72.0 0 a 36.0 36.0 0 1 0 -72.0 0" /></g><g xmlns="http://www.w3.org/2000/svg" transform="translate(0.0 0)"><path d="M 549.0 338.0 L 549.0 444.0" /></g></g><g class="letter" style="animation-delay:0.565s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(10.0 0)"><path d="M 555.0 408.0 a 36.0 36.0 0 1 0 72.0 0 a 36.0 36.0 0 1 0 -72.0 0" /></g><g xmlns="http://www.w3.org/2000/svg" transform="translate(10.0 0)"><path d="M 627.0 372.0 L 627.0 444.0" /></g></g><g class="letter" style="animation-delay:0.650s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(10.0 0)"><path d="M645 444 V408 C645 360 717 360 717 408 V444" /></g></g><g class="letter" style="animation-delay:0.735s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(10.0 0)"><path d="M 735.0 338.0 L 735.0 444.0" /></g><g xmlns="http://www.w3.org/2000/svg" transform="translate(10.0 0)"><path d="M 735.0 408.0 a 36.0 36.0 0 1 0 72.0 0 a 36.0 36.0 0 1 0 -72.0 0" /></g></g><g class="letter" style="animation-delay:0.820s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(20.0 0)"><path d="M 813.0 408.0 a 36.0 36.0 0 1 0 72.0 0 a 36.0 36.0 0 1 0 -72.0 0" /></g></g><g class="letter" style="animation-delay:0.905s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(20.0 0)"><path d="M 904.0 338.0 L 904.0 444.0" /></g></g><g class="letter" style="animation-delay:0.990s"><g xmlns="http://www.w3.org/2000/svg" transform="translate(16.0 0)"><path d="M938 338 V422 Q938 444 961 444" /></g><g xmlns="http://www.w3.org/2000/svg" transform="translate(16.0 0)"><path d="M 938.0 372.0 L 961.0 372.0" /></g></g></g><circle class="source" cx="340" cy="392" r="11" fill="#25211f"/></svg>